<div class="min-h-[85vh] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl space-y-6">
    <!-- Icono Oficial de Nora (App Icon) -->
    <div class="text-center space-y-3">
      <div class="flex justify-center">
        <img
          src="assets/nora-icon.svg"
          alt="Nora Icon"
          class="w-16 h-16 rounded-2xl shadow-xl shadow-indigo-600/30 border border-slate-800 object-contain hover:scale-105 transition-transform"
        />
      </div>
      <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-100 to-indigo-200 bg-clip-text text-transparent">
        Nora
      </h1>
      <p class="text-xs text-slate-400">
        Inicia sesión para gestionar tu agenda y equipo con IA
      </p>
    </div>

    <!-- Mensaje de Error -->
    @if (errorMessage()) {
      <div class="p-3.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-300 text-xs leading-relaxed flex items-start gap-2.5">
        <app-icon name="shield-audit" customClass="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></app-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Formulario de Inicio de Sesión -->
    <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4 text-xs">
      <div>
        <label class="block text-slate-400 font-medium mb-1.5">Correo electrónico</label>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          autocomplete="email"
          placeholder="nombre@nora.com"
          class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-600 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-slate-400 font-medium mb-1.5">Contraseña</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          autocomplete="current-password"
          placeholder="••••••••"
          class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-600 outline-none transition"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading() || !email().trim() || !password()"
        class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2 text-xs"
      >
        @if (loading()) {
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
          <span>Validando credenciales...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>
  </div>
</div>
