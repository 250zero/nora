<div class="min-h-[85vh] flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl space-y-6">
    <!-- Logo y Encabezado -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 shadow-xl shadow-indigo-500/20 mb-2">
        <app-icon name="nora-spark" customClass="w-7 h-7 text-amber-300"></app-icon>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-100 tracking-tight">Nora</h1>
      <p class="text-xs text-slate-400">
        Asistente de agenda y tareas con IA integrada
      </p>
    </div>

    <!-- Selector de Modo (Login vs Registro) -->
    <div class="flex p-1 bg-slate-950/80 rounded-xl border border-slate-800 text-xs font-semibold">
      <button
        type="button"
        (click)="mode.set('login'); errorMessage.set(null)"
        class="flex-1 py-2 rounded-lg transition"
        [class]="mode() === 'login' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
      >
        Iniciar Sesión
      </button>
      <button
        type="button"
        (click)="mode.set('register'); errorMessage.set(null)"
        class="flex-1 py-2 rounded-lg transition"
        [class]="mode() === 'register' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'"
      >
        Crear Cuenta
      </button>
    </div>

    <!-- Mensaje de Error -->
    @if (errorMessage()) {
      <div class="p-3.5 bg-rose-500/10 border border-rose-500/20 rounded-xl text-rose-300 text-xs leading-relaxed flex items-start gap-2.5">
        <app-icon name="shield-audit" customClass="w-4 h-4 text-rose-400 shrink-0 mt-0.5"></app-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Formulario Principal -->
    <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4 text-xs">
      @if (mode() === 'register') {
        <div>
          <label class="block text-slate-400 font-medium mb-1.5">Nombre completo</label>
          <input
            type="text"
            [ngModel]="displayName()"
            (ngModelChange)="displayName.set($event)"
            name="displayName"
            required
            placeholder="Ej. Ana Gómez"
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 outline-none transition"
          />
        </div>
      }

      <div>
        <label class="block text-slate-400 font-medium mb-1.5">Correo electrónico</label>
        <input
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          placeholder="tu@correo.com"
          class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 outline-none transition"
        />
      </div>

      <div>
        <label class="block text-slate-400 font-medium mb-1.5">Contraseña</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          placeholder="••••••••"
          class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-3.5 py-2.5 text-slate-100 placeholder-slate-500 outline-none transition"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 disabled:opacity-50 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/25 transition flex items-center justify-center gap-2 text-xs"
      >
        @if (loading()) {
          <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
          <span>Procesando con Supabase Auth...</span>
        } @else {
          <span>{{ mode() === 'login' ? 'Acceder a Nora' : 'Registrarme' }}</span>
        }
      </button>
    </form>

    <!-- Tarjetas de Acceso Rápido Demo -->
    <div class="pt-4 border-t border-slate-800/80 space-y-2.5">
      <p class="text-[11px] text-center uppercase font-bold tracking-wider text-slate-500">
        Acceso Rápido de Evaluación
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
        <!-- Demo Supervisor -->
        <button
          type="button"
          (click)="setDemoUser('supervisor')"
          [disabled]="loading()"
          class="p-2.5 bg-slate-950 hover:bg-slate-800/70 border border-purple-500/30 rounded-xl text-left transition flex items-center gap-2.5 group"
        >
          <div class="w-7 h-7 rounded-lg bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 shrink-0">
            <app-icon name="shield-audit" customClass="w-3.5 h-3.5"></app-icon>
          </div>
          <div>
            <p class="text-[11px] font-bold text-slate-200 group-hover:text-purple-300">Ana Gómez</p>
            <p class="text-[9px] text-purple-400">Rol: Supervisor</p>
          </div>
        </button>

        <!-- Demo Miembro -->
        <button
          type="button"
          (click)="setDemoUser('miembro')"
          [disabled]="loading()"
          class="p-2.5 bg-slate-950 hover:bg-slate-800/70 border border-blue-500/30 rounded-xl text-left transition flex items-center gap-2.5 group"
        >
          <div class="w-7 h-7 rounded-lg bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 shrink-0">
            <app-icon name="users-group" customClass="w-3.5 h-3.5"></app-icon>
          </div>
          <div>
            <p class="text-[11px] font-bold text-slate-200 group-hover:text-blue-300">Juan Pérez</p>
            <p class="text-[9px] text-blue-400">Rol: Miembro</p>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
