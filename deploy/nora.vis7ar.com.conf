# Virtual Host Nginx para Nora en Visar (0 Docker)
# Dominio Frontend: nora.vis7ar.com
# Dominio API Backend: api.nora.vis7ar.com

# 1. Frontend PWA Angular
server {
    listen 80;
    listen [::]:80;
    server_name nora.vis7ar.com;

    root /var/www/nora.vis7ar.com/dist/nora/browser;
    index index.html;

    # Compresión Gzip para optimizar velocidad de carga en móvil
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache agresivo para estáticos versionados
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Proxy inverso transparente a API Deno
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enrutamiento SPA Angular (HTML5 pushState)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 2. Subdominio dedicado API Backend (api.nora.vis7ar.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.nora.vis7ar.com;

    location / {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
